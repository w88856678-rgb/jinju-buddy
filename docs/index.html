<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#19372d">
  <meta name="referrer" content="no-referrer">
  <title>金句 Buddy · 公网体验</title>
  <link rel="icon" href="./assets/red-flower.png" type="image/png">
  <link rel="stylesheet" href="./site.css">
  <script src="./site.js" type="module"></script>
</head>
<body>
  <header><div class="brand"><img src="./assets/red-flower.png" alt="" width="42" height="42"><span>金句 Buddy</span></div></header>
  <main>
    <h1>现场金句体验</h1>
    <p>在控台收音、选句、发送。用手机或另一台电脑打开观众屏，就能看到同一句金句。</p>
    <nav aria-label="体验入口">
      <a class="button primary" href="?view=control">进入体验控台 <span aria-hidden="true">↗</span></a>
      <a class="button" href="?view=stage">打开观众屏 <span aria-hidden="true">↗</span></a>
    </nav>
    <p class="note">两个入口都可直接打开。所有访客共用一场体验，发言和上屏内容彼此可见。</p>
    <p id="status" role="status" hidden></p>
    <button id="retry" type="button" hidden>重新连接</button>
    <figure>
      <video controls muted loop playsinline preload="metadata" poster="./assets/stage-poster.png?v=uhd-1" aria-label="Buddy 打招呼、待场、思考出金句、连续换句和递花出二维码的完整演示">
        <source src="./assets/buddy-stage.mp4?v=summary-1" type="video/mp4">
      </video>
      <figcaption>观众屏完整演示 · 53.4 秒 · <a href="./assets/buddy-stage.mp4?v=summary-1">打开高清原片（3840 × 960）</a></figcaption>
    </figure>
    <nav class="clips" aria-label="单项动效视频">
      <a href="./assets/buddy-greeting.mp4?v=9be10fa">打招呼动效</a>
      <a href="./assets/buddy-idle.mp4?v=9be10fa">待场动效</a>
      <a href="./assets/buddy-quote.mp4?v=9be10fa">思考出金句</a>
      <a href="./assets/buddy-switch.mp4">连续换句上滚</a>
      <a href="./assets/buddy-summary.mp4">递花出二维码</a>
    </nav>
  </main>
</body>
</html>
